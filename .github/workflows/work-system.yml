# This repository's own work-system PR check, from its own action (other repositories pin it by commit SHA:
# actions/work-system-pr/README.md). No Jira credentials here: the repository is public, so the ticket itself is
# not read; title, Jira line, Docs line and the Decision/ADR rule still hold.
name: work-system
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./actions/work-system-pr
