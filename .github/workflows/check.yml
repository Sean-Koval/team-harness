# CI for the team harness repository.
name: harness
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # pin the tools: a newer hangar may change the lock rules under you; bump deliberately
  HANGAR_REF: c7a2de229aecbad9b82d9cddd6112776dc6c9c5a
  FLIGHTDECK_REF: 4fb5c2c98439b3393e4a28845f059cb86b9cbb93
  AI_DLC_REF: 72327f45d698a255cc6959b68b107a88f6fa421d   # environments/agent.yaml's pin; the knowledge tests run against it

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # channels resolve through the history of each harness.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install hangar and flightdeck from git
        run: |
          pip install "hangar @ git+https://github.com/Sean-Koval/hangar@${HANGAR_REF}" \
                      "flightdeck @ git+https://github.com/Sean-Koval/flightdeck@${FLIGHTDECK_REF}" pytest
      # ai-dlc in its own venv (its mcp pin and hangar's disagree); only its CLI goes on PATH, for the env-only
      # knowledge query test, which fails rather than skips when CI lacks it
      - name: Install the ai-dlc CLI at the pinned ref
        run: |
          python -m venv "$RUNNER_TEMP/ai-dlc"
          "$RUNNER_TEMP/ai-dlc/bin/pip" install --quiet "ai-dlc @ git+https://github.com/Sean-Koval/ai-dlc@${AI_DLC_REF}"
          mkdir -p "$RUNNER_TEMP/bin" && ln -s "$RUNNER_TEMP/ai-dlc/bin/ai-dlc" "$RUNNER_TEMP/bin/ai-dlc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: hangar harness check
        run: |
          for d in harnesses/*/; do hangar harness check "$d"; done
      - name: Shared work-system layer in sync
        run: python scripts/sync_shared.py --check
      - name: Guides, environments and channels
        run: python scripts/check_registry.py .
      - name: Behavior specs lint
        run: flightdeck spec lint flightdeck/specs/*.yaml
      - name: Task check (regression-v0)
        run: flightdeck task check flightdeck/suites/regression-v0/tasks/*/
      - name: Hook tests
        run: python -m pytest -q tests

  # Coworkers run the hooks natively on Windows (KAN-460). No bash: every step is Python under PowerShell. The checkout
  # keeps Git for Windows' default CRLF conversion, as a coworker's clone would; .gitattributes holds the pinned
  # harness files at LF. The installer's tests run here too: py -3 hook commands, settings.json back byte for byte.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.13 changed os.path.isabs on Windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest pyyaml
      - name: Hook tests
        run: >-
          python -m pytest -q -rs tests/test_guard_work_system.py tests/test_guard_work.py
          tests/test_guard_readonly.py tests/test_sync_shared.py
      - name: Installer tests
        run: python -m pytest -q -rs tests/test_install_local.py
