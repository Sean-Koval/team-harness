# CI for the team harness repository.
name: harness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # generated.yml starts it on bot/generated: a PR it opens with GITHUB_TOKEN starts no workflows

permissions:
  contents: read

env:
  # pin the tools: a newer hangar may change the lock rules under you; bump deliberately
  HANGAR_REF: c7a2de229aecbad9b82d9cddd6112776dc6c9c5a
  FLIGHTDECK_REF: 4fb5c2c98439b3393e4a28845f059cb86b9cbb93
  AI_DLC_REF: 72327f45d698a255cc6959b68b107a88f6fa421d   # environments/agent.yaml's pin; the knowledge tests run against it

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # channels resolve through the history of each harness.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install hangar and flightdeck from git
        run: |
          pip install "hangar @ git+https://github.com/Sean-Koval/hangar@${HANGAR_REF}" \
                      "flightdeck @ git+https://github.com/Sean-Koval/flightdeck@${FLIGHTDECK_REF}" pytest
      # ai-dlc in its own venv (its mcp pin and hangar's disagree); only its CLI goes on PATH, for the env-only
      # knowledge query test, which fails rather than skips when CI lacks it
      - name: Install the ai-dlc CLI at the pinned ref
        run: |
          python -m venv "$RUNNER_TEMP/ai-dlc"
          "$RUNNER_TEMP/ai-dlc/bin/pip" install --quiet "ai-dlc @ git+https://github.com/Sean-Koval/ai-dlc@${AI_DLC_REF}"
          mkdir -p "$RUNNER_TEMP/bin" && ln -s "$RUNNER_TEMP/ai-dlc/bin/ai-dlc" "$RUNNER_TEMP/bin/ai-dlc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # PRs commit sources only; the generated files (shared-layer copies, locks, env files, candidate, the agent
      # environment's pin) are built here on the PR merged with main, and on main after merge by generated.yml
      # (KAN-481). The checks below run on the built tree, so committed generated files needn't be current.
      - name: The PR commits no generated files (label generated-files for a lock frozen from a run)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'generated-files')
        run: python scripts/build_generated.py --guard HEAD^1   # the merge ref's first parent is the base
      - name: Build generated files
        run: python scripts/build_generated.py --note "built in CI"
      - name: A generated file the PR commits matches the build (a hand-edited copy fails, labelled or not)
        if: github.event_name == 'pull_request'
        run: python scripts/build_generated.py --drift HEAD^1
      - name: Changelog fragments
        run: python scripts/collect_changes.py
      - name: hangar harness check
        run: |
          for d in harnesses/*/; do hangar harness check "$d"; done
      - name: Guides, environments and channels
        run: python scripts/check_registry.py .
      - name: Behavior specs lint
        run: flightdeck spec lint flightdeck/specs/*.yaml
      - name: Task check (regression-v0)
        run: flightdeck task check flightdeck/suites/regression-v0/tasks/*/
      - name: Hook tests
        run: python -m pytest -q tests

  # Coworkers run the hooks natively on Windows (KAN-460). No bash: every step is Python under PowerShell. The checkout
  # keeps Git for Windows' default CRLF conversion, as a coworker's clone would; .gitattributes holds the pinned
  # harness files at LF. The installer's tests run here too: py -3 hook commands, settings.json back byte for byte.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.13 changed os.path.isabs on Windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # as the Linux job: the build resolves channels through each harness.lock's history
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install pytest pyyaml
      # The installer refuses a harness whose files don't match its lock, so a PR that edits a hook needs the locks
      # built here too, not only the shared layer's copies (KAN-481). hangar goes in a venv of its own, used to build
      # and for the digest tests: the other tests still run without it, as before.
      - name: Build generated files (hangar in its own venv)
        env:
          PYTHONUTF8: "1"   # text opened without an encoding (in hangar, say) is UTF-8, as on Linux, not cp1252
        run: |
          python -m venv "$env:RUNNER_TEMP\hangar"
          & "$env:RUNNER_TEMP\hangar\Scripts\python.exe" -m pip install --quiet "hangar @ git+https://github.com/Sean-Koval/hangar@$env:HANGAR_REF"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\hangar\Scripts\python.exe" scripts/build_generated.py --note "built in CI"
          exit $LASTEXITCODE
      - name: Hook tests
        run: >-
          python -m pytest -q -rs tests/test_guard_work_system.py tests/test_guard_work.py
          tests/test_guard_readonly.py tests/test_sync_shared.py tests/test_session_hooks.py
      # each test step runs even when an earlier one failed, so one failure can't hide the others' results
      - name: SessionEnd hook tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs tests/test_knowledge_skills.py -k hook
      - name: Installer tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs tests/test_install_local.py
      # The installer's own digests against hangar's, on a Windows checkout (CRLF conversion on): the tests above
      # skip these, as their interpreter has no hangar, so they run here with the build's venv.
      - name: Installer digests match hangar's
        if: ${{ !cancelled() }}
        run: |
          & "$env:RUNNER_TEMP\hangar\Scripts\python.exe" -m pip install --quiet pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\hangar\Scripts\python.exe" -m pytest -q -rs tests/test_install_local.py -k test_digests_match_hangar
          exit $LASTEXITCODE
