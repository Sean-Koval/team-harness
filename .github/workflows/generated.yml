# Builds the generated files on main after each merge (KAN-481): the shared layer's copies, each harness's lock and
# env files, `candidate` and the agent environment's harness pin (scripts/build_generated.py). PRs commit sources
# only, so they never conflict on these. `stable` and releases/ are left alone: only scripts/promote.py moves them.
# Two jobs, as ai-dlc's release.yml splits them: `build` installs check.yml's tools (hangar, flightdeck, the ai-dlc
# CLI), runs the build and check.yml's checks with read-only access, and hands over a patch; `push` holds the write token, installs nothing and runs no repository code: it applies the
# patch and pushes it to main. If main moved during the build, the run queued behind this one rebuilds; if main
# refuses the push (protection), it goes to bot/generated as a PR, and check.yml is started on that branch by
# workflow_dispatch (a push or PR made with GITHUB_TOKEN starts no workflows itself).
name: generated
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: generated-main   # one build at a time, in merge order
  cancel-in-progress: false

env:
  # the same tools as check.yml, at the same refs (tests/test_parallel_prs.py holds them equal), so the checks
  # below pass here exactly when they pass on a PR
  HANGAR_REF: 353c917b876b65aada4cd6291ad70136d88ebd13
  FLIGHTDECK_REF: 4fb5c2c98439b3393e4a28845f059cb86b9cbb93
  AI_DLC_REF: 72327f45d698a255cc6959b68b107a88f6fa421d
  PYTEST_VERSION: "9.2.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # as check.yml: a release copy renders with the bindings of the commit that added it
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install hangar and flightdeck from git
        run: |
          pip install "hangar @ git+https://github.com/Sean-Koval/hangar@${HANGAR_REF}" \
                      "flightdeck @ git+https://github.com/Sean-Koval/flightdeck@${FLIGHTDECK_REF}" "pytest==${PYTEST_VERSION}"
      - name: Install the ai-dlc CLI at the pinned ref   # as check.yml: the knowledge query test fails without it
        run: |
          python -m venv "$RUNNER_TEMP/ai-dlc"
          "$RUNNER_TEMP/ai-dlc/bin/pip" install --quiet "ai-dlc @ git+https://github.com/Sean-Koval/ai-dlc@${AI_DLC_REF}"
          mkdir -p "$RUNNER_TEMP/bin" && ln -s "$RUNNER_TEMP/ai-dlc/bin/ai-dlc" "$RUNNER_TEMP/bin/ai-dlc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          # a merge commit's subject is "Merge pull request #N ..."; its body's first line is the PR title
          note="$(git log -1 --format=%s)"
          case "$note" in "Merge pull request"*) note="$(git log -1 --format=%b | head -n 1)";; esac
          python scripts/build_generated.py --note "$note"
      - name: Check the build as PR CI would
        run: |
          for d in harnesses/*/; do hangar harness check "$d"; done
          python scripts/check_registry.py .
          python -m pytest -q tests
      - name: Patch of the generated files
        id: diff
        run: |
          git add -A -- harnesses channels.yaml environments
          git diff --cached --binary --no-ext-diff > "$RUNNER_TEMP/generated.patch"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: generated-patch
          path: ${{ runner.temp }}/generated.patch
          retention-days: 1

  push:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write   # to start check.yml on bot/generated
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.base }}   # the commit the patch was built on
          persist-credentials: false             # the token reaches only the push below
      - uses: actions/download-artifact@v4
        with:
          name: generated-patch
          path: ${{ runner.temp }}
      # The build job ran repository code and installed packages, so its patch isn't trusted. Before applying it:
      # refuse any path the build doesn't write (releases/, shared/, workflows) or with a `..`, any symlink, mode
      # change, rename or copy, and any binary hunk outside a skill copy. After applying it, channels.yaml may differ
      # only in `candidate:` lines and environments/agent.yaml only in its AGENT_ENV_HARNESS_DIGEST line (only
      # promote.py moves stable). Shell and git only.
      - name: Apply the patch, refusing anything outside the generated files
        run: |
          P="$RUNNER_TEMP/generated.patch"
          bad=$( { git apply --numstat "$P" | cut -f3- | grep -vE '^(harnesses/[^/]+/(skills/[^/]+/|native/claude-code/hooks/[^/]+$|harness\.lock$|env\.(stable|candidate)\.yaml$|\.env\.example$)|channels\.yaml$|environments/agent\.yaml$)'; \
                   git apply --numstat "$P" | cut -f3- | grep -E '(^|/)\.\.(/|$)'; \
                   git apply --numstat "$P" | grep -P '^-\t-\t' | cut -f3- | grep -vE '^harnesses/[^/]+/skills/'; \
                   git apply --summary "$P" | grep -E 'mode 120000|mode change|rename|copy'; } || true )
          [ -z "$bad" ] || { echo "the patch reaches outside the generated files:"; echo "$bad"; exit 1; }
          git apply --index "$P"
          changed() { git diff --cached --text -U0 -- "$1" | awk '/^@@/ { h = 1; next } h && /^[-+]/'; }
          bad=$( { changed channels.yaml \
                     | grep -vE '^[-+]  candidate: "sha256:[0-9a-f]{64}"( +#.*)?$'; \
                   changed environments/agent.yaml \
                     | grep -vE '^[-+] +AGENT_ENV_HARNESS_DIGEST: "sha256:[0-9a-f]{64}"( +#.*)?$'; } || true )
          [ -z "$bad" ] || { echo "the patch changes more than candidate and the agent pin:"; echo "$bad"; exit 1; }
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.build.outputs.base }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "build: regenerate after $(git rev-parse --short HEAD) (KAN-481)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" HEAD:main && exit 0
          git fetch -q "$remote" main
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE" ]; then
            echo "main moved during the build; the run queued for that merge rebuilds"; exit 0
          fi
          echo "main refused the push; opening a PR from bot/generated instead"
          git push -f "$remote" HEAD:refs/heads/bot/generated
          if [ "$(gh pr list --head bot/generated --state open --json number --jq length)" = "0" ]; then
            gh pr create --head bot/generated --base main \
              --title "KAN-481: regenerate generated files" \
              --body "$(printf 'Built by generated.yml from main: scripts/build_generated.py.\n\nJira: KAN-481\nDocs: none needed - generated files only')"
          fi
          gh workflow run check.yml --ref bot/generated   # its checks, on the PR's head commit
