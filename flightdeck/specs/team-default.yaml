# Behavior contracts for the team-default harness (flightdeck docs/behavior-specs.md), predicates over
# hangar.trace/v1. A stub suite: replace and extend with the failures your team labels. Contracts are keyed by
# harness name, never digest, so they hold for stable and candidate alike and judge both arms of an experiment.
#   flightdeck spec lint flightdeck/specs/team-default.yaml
#   flightdeck spec test flightdeck/specs/team-default.yaml --trace export.json
schema: flightdeck.spec/v1
id: tests-before-commit
harness: "*"
scope: job
applies_when: {source: [job, experiment]}
assert:
  # hangar's trusted verify run precedes every delivered commit
  before:
    first: {event: test.run}
    then: {event: git.commit}
---
id: delivers-a-pr
scope: job
applies_when: {source: [job, experiment]}
assert:
  eventually: {event: pr.open}
---
id: reads-the-ticket-before-editing
scope: turn
applies_when: {source: [job, experiment]}
assert:
  order:
    - {tool: {kind: mcp, mcp: {server: jira}}}
    - {tool: {kind: edit}}
---
id: never-push-main
scope: turn
applies_when: {}
assert:
  never: {tool: {kind: shell, ops: [git.push]}, where: {input: {regex: "\\b(main|master)\\b"}}}
---
id: cluster-stays-read-only
scope: turn
applies_when: {}
assert:
  # the gke server runs --read-only; this catches a binding that drifted from it
  never: {tool: {kind: mcp, mcp: {server: gke}}, where: {mcp_tool: {regex: "(create|update|patch|delete|apply|scale|exec)"}}}
---
id: log-search-stays-read-only
scope: turn
applies_when: {}
assert:
  never: {tool: {kind: mcp, mcp: {server: splunk}}, where: {mcp_tool: {regex: "(create|update|delete|save)"}}}
