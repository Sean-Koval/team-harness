# Behavior contracts for the work-default harness (flightdeck docs/behavior-specs.md), predicates over hangar.trace/v1.
# A stub to extend with the failures your team labels; keyed by harness name, so they judge every revision.
#   flightdeck spec lint flightdeck/specs/work-default.yaml
# The last two match on tool input text, which lint flags as a hint: the harness's guard_work.py hook is what enforces
# them; these catch a hook or a binding that drifted.
schema: flightdeck.spec/v1
id: work-reads-the-ticket-before-editing
harness: work-default
scope: turn
applies_when: {source: [job, experiment]}
assert:
  order:
    - {tool: {kind: mcp, mcp: {server: jira}}}
    - {tool: {kind: edit}}
---
id: work-never-edits-the-deploy-checkout
harness: work-default
scope: turn
applies_when: {}
assert:
  # the trigger-deployment repo is the change set's deploy step's, after every other role merged
  never: {tool: {kind: edit}, where: {input: {regex: "/workspace/deploy/"}}}
---
id: work-infra-stays-unapplied
harness: work-default
scope: turn
applies_when: {}
assert:
  never: {tool: {kind: shell}, where: {input: {regex: "\\bterraform\\b.*\\b(apply|destroy|import)\\b"}}}
