# Work-system contracts (Sean-Koval/cabinet config/work-system/model.toml) for the harnesses that carry the shared
# layer (shared/work-system/targets.yaml): predicates over hangar.trace/v1, keyed by harness name.
# Structural enforcement comes first (the guard_work_system.py hook in the session, actions/work-system-pr on the PR);
# these catch drift in either, and measure what no hook can (questions raised as Decisions, tickets read first).
#   flightdeck spec lint flightdeck/specs/work-system.yaml
# `[sw]*-default` is an fnmatch/GLOB set: suite-default and work-default, not team-default (the A/B example).
schema: flightdeck.spec/v1
id: ws-ticket-read-before-first-edit
harness: "[sw]*-default"
scope: job
applies_when: {source: [job]}
assert:
  # a Jira-door job gets its ticket as ~/.hangar/jobs/<job>/jira-KEY.md; `before` is not_applicable when nothing is edited
  before:
    first: {tool: {kind: read}, where: {input: {regex: "jira-[A-Z][A-Z0-9]+-[0-9]+\\.md"}}}
    then: {tool: {kind: edit}}
---
id: ws-key-in-pushed-branch
scope: job
applies_when: {source: [job]}
assert:
  eventually: {event: git.push, where: {vcs.ref.head.name: {regex: "^(hangar/)?[A-Z][A-Z0-9]+-[0-9]+"}}}
---
id: ws-question-raised-as-decision
scope: job
applies_when: {source: [job, session]}
assert:
  # every question hangar relays to a person follows a Decision ticket created in the tracker
  each: {event: question}
  requires_prior:
    tool: {kind: mcp}
    where: {mcp_server: {in: [jira, atlassian]}, mcp_tool: {regex: "(?i)create"}, input: {regex: "(?i)decision"}}
---
id: ws-agent-never-transitions
scope: turn
applies_when: {}
assert:
  # the hook refuses these; a pass rate below 100% means a session ran without it
  never: {tool: {kind: mcp}, where: {mcp_tool: {regex: "(?i)^transition"}}}
---
id: ws-adr-never-deleted
scope: turn
applies_when: {}
assert:
  never: {event: file.change, where: {path: {regex: "^docs/decisions/"}, op: delete}}
---
id: ws-ci-and-ownership-untouched
scope: turn
applies_when: {}
assert:
  never: {event: file.change, where: {path: {regex: "^(\\.github/(workflows/|CODEOWNERS)|CODEOWNERS$)"}}}
---
id: ws-never-sets-lane-agent
scope: turn
applies_when: {}
assert:
  # only a person makes work run unattended; the hook refuses this, so a failure means a session ran without it.
  # exec:agent is the label's name; lane:agent its older one (the id keeps the old name so pass rates stay comparable)
  never: {tool: {kind: mcp}, where: {mcp_tool: {regex: "(?i)(create|edit)JiraIssue"}, input: {regex: "(exec|lane):agent"}}}
