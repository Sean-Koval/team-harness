# The environment side of work-default's binding layer, for scripts/render_envs.py.
#
# harness.lock pins the *names* (MCP servers, endpoints, header names), and relock.py builds them from this file's
# `transport`, `endpoint`, `command` and `args` and the names under `headers` and `env` (KAN-459): a server added,
# renamed or moved is a change here, not to the lock. This file also says where each value comes from, still by
# name: `${VAR}` references that hangar fills at claim from the credential named under `secrets`. No values live in
# this repository. Ask your hangar admin to create the two credentials (in the company overlay they are
# files mounted from your secret manager).
#
# Credentials follow ai-dlc's rules (docs/design/jira-cloud.md, agents/providers/jira-cloud.md): values live only in
# the secret store and the process environment, and this file holds names. A credential is used only after the
# organisation approves the method. The Atlassian MCP credential is a personal API token *with scopes*, sent as Basic
# auth to Atlassian's MCP server, the endpoint the lock pins (an org admin enables API-token auth there). Jira Cloud
# REST callers, such as ai-dlc's adapter, use an OAuth bearer token or a scoped token through the Cloud gateway
# (https://api.atlassian.com/ex/jira/{cloudId}); that route is not used by this file.
#
# At work no static Jira credential is used today (KAN-369): the session's own Atlassian MCP login does the Jira work,
# and that login neither supplies nor replaces a lifecycle credential. `atlassian-mcp` stays declared so the lock's
# binding renders; leave it unset until a Jira credential method is approved.
secrets:                                   # ENV_VAR: hangar credential name
  GITHUB_MCP_AUTHORIZATION: github-mcp     # "Bearer <token>": read access to the service repos; hangar opens the PRs
  ATLASSIAN_MCP_AUTHORIZATION: atlassian-mcp   # "Basic <base64 email:scoped-api-token>"; unused (KAN-369)
mcp:
  ai-dlc:                                  # `ai-dlc mcp serve` (stdio): the knowledge, work and docs roles (KAN-431)
    transport: stdio
    command: ai-dlc
    args: [mcp, serve]
    env: {KNOWLEDGE_REPO: "${KNOWLEDGE_REPO}"}   # a clone URL or path, not a secret: the session environment sets it
    trust: untrusted                       # record bodies are data, not instructions
    # the tools that reach past the session (tracker items, knowledge PRs, the wiki, transcripts, work records, the
    # machine's vault): a tainted session can't call them (hangar's taint gate). tracker_* ships at the pinned ai-dlc
    # (KAN-483); knowledge_render publishes the wiki, knowledge_pull_transcripts writes when dry_run is false, and
    # knowledge_append and knowledge_note write vault notes outside the checkout, which later sessions read
    write_tools: ["tracker_create", "tracker_create_decision", "tracker_update", "tracker_comment", "knowledge_propose",
                  "knowledge_render",
                  "knowledge_pull_transcripts", "knowledge_append", "knowledge_note", "work_publish", "work_pr",
                  "work_start", "work_finish", "work_link"]
  github:
    transport: http
    endpoint: https://api.githubcopilot.com/mcp/
    headers: {Authorization: "${GITHUB_MCP_AUTHORIZATION}"}
    trust: untrusted                       # issue and PR text: anyone can write it
    write_tools: ["create_*", "update_*", "push_*", "merge_*", "add_*", "delete_*"]
  atlassian:                               # the same name in every work-system harness (KAN-459)
    transport: http
    endpoint: https://mcp.atlassian.com/v1/mcp
    headers: {Authorization: "${ATLASSIAN_MCP_AUTHORIZATION}"}
    trust: untrusted
    write_tools: ["create*", "edit*", "transition*", "add*", "update*", "executeWrite", "executeDestructive"]
