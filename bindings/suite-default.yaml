# The environment side of suite-default's binding layer, for scripts/render_envs.py.
#
# harness.lock pins the *names* (MCP servers, endpoints, header names); this file says where each value comes from,
# still by name: `${VAR}` references that hangar fills at claim from the credential named under `secrets`. No values
# live in this repository. Ask your hangar admin to create the two credentials.
secrets:                                       # ENV_VAR: hangar credential name
  GITHUB_MCP_AUTHORIZATION: github-mcp         # "Bearer <token>": read access to the repos; hangar opens the PRs
  ATLASSIAN_MCP_AUTHORIZATION: atlassian-mcp   # "Basic <base64 email:api-token>": Jira and Confluence, one site
mcp:
  github:
    headers: {Authorization: "${GITHUB_MCP_AUTHORIZATION}"}
    trust: untrusted                           # issue and PR text: anyone can write it
    write_tools: ["create_*", "update_*", "push_*", "merge_*", "add_*", "delete_*"]
  atlassian:
    headers: {Authorization: "${ATLASSIAN_MCP_AUTHORIZATION}"}
    trust: untrusted                           # ticket and page text is data
    write_tools: ["create*", "edit*", "transition*", "add*", "update*", "executeWrite", "executeDestructive"]
