# The agent role, defined once (KAN-447). A run on Sean's computer and a cloud session start from this spec, so a
# local run is evidence about a cloud one:
#
# - cloud: hangar loads it from HANGAR_ENV_DIRS (this directory) and renders and runs it, like the role environments;
# - local: `make agent-env` runs it with `hangar env local` (KAN-472): hangar's renderer builds the image, and it
#   starts under this egress policy, with no host directory mounted and no DNS out.
#
# Pinned here: the harness (suite-default, by its harness_digest), ai-dlc (a commit, installed from its uv.lock), the
# knowledge format version and the model. scripts/check_registry.py fails when a pin and what it names disagree.
# Credentials and inputs are names only; agent.env.example is the contract, the same names locally and in hangar's
# secret store. Inputs come from git and the tracker: TICKET_KEY, CODE_REPO, KNOWLEDGE_REPO.
name: agent
extends: suite-default-candidate  # the current lock; suite-default serves stable's release copy
description: suite-default + ai-dlc pinned, for one ticket's run; the same image on a laptop and in hangar
model: claude-opus-5-5
tools:
  apt: [gh]              # ai-dlc's core module: git and gh
  mise:
    python: "3.12.11"    # ai-dlc's own pins (its mise.toml and modules/catalog.toml)
    uv: "0.9.11"
    node: "22.23.1"
    "npm:@fission-ai/openspec": "1.5.0"
dependencies:
  script: |
    git clone --quiet --filter=blob:none https://github.com/Sean-Koval/ai-dlc /home/agent/.local/share/ai-dlc
    git -C /home/agent/.local/share/ai-dlc checkout --quiet "72327f45d698a255cc6959b68b107a88f6fa421d"
    cd /home/agent/.local/share/ai-dlc
    UV_PYTHON_DOWNLOADS=never uv sync --locked --no-dev --python "$(mise which python)"
    mkdir -p /home/agent/.local/bin
    ln -sf /home/agent/.local/share/ai-dlc/.venv/bin/ai-dlc /home/agent/.local/bin/ai-dlc
files:                            # ai-dlc's machine file for `ai-dlc doctor` on the cloned inputs (the Makefile)
  .agent-env/machine.toml: |
    schema = 4

    [paths]
    vault = "/workspace/knowledge"

    [target]
    name = "local"
    headless = true

    [credentials.github]
    source = "environment"
    variable = "GH_TOKEN"
env:
  AGENT_ENV: agent
  AGENT_ENV_HARNESS: suite-default
  AGENT_ENV_HARNESS_DIGEST: "sha256:b70487422e2896cd4f5301805a7d7d558b26afac40395c2a0378525ca3779328"  # r13
  AI_DLC_REF: "72327f45d698a255cc6959b68b107a88f6fa421d"
  KNOWLEDGE_FORMAT_VERSION: "1"   # ai-dlc's knowledge-record FORMAT_VERSION; a knowledge repo pins [format] version
secrets:                          # ENV_VAR: hangar credential name (values never live here)
  GH_TOKEN: github-agent          # clone CODE_REPO and KNOWLEDGE_REPO, read the repo's API
egress:
  mode: allowlist
  presets: [packages, github]     # the package indexes; GitHub for the code and knowledge repos
  allow:
  - api.atlassian.com             # the tracker and wiki gateway (Jira and Confluence Cloud REST)
  - mcp.atlassian.com             # the Atlassian MCP server the harness binds
