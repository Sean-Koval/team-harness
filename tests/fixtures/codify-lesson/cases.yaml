# Example lessons for the codify-lesson skill (KAN-470).
#
# Each case is a small knowledge repository. before/ is what the skill sees: the open lesson and any records already
# there. after/ is the repository once the PR the skill opens merges; followup/ is the repository once the follow-up
# that marks the lesson codified merges (the convention numbered, as at merge). A harness change (outcome b) changes
# no record, so its after/ equals before/, and harness-pr.md is the expected pull request: its title, the harness
# files it changes and its body citing the lesson; harness-pr-owner-is-author.md is the same PR when the owner is its
# author and cannot be asked to review it. A not-codifiable lesson (outcome c) and a draft convention have
# no follow-up yet.
# All names and URLs are invented. `ai-dlc knowledge check` exits 0 on every tree.
format: codify-lesson-cases/v1
cases:
- id: 01-token-economics
  lesson: LES-0004
  outcome: convention
  status: draft
  tests: 'Spec scenario 4: a harness token-economics finding becomes a team Convention that cites the lesson in its
    sources. DEC-0031 decides where skills live, not how long they are, so no accepted decision covers the rule: the
    convention is a draft that links no decision, and its follow-up waits until it is active.'
  writes: [team/conventions/skill-md-under-150-lines.md]
  governing_decision: null
- id: 02-hook-refusal
  lesson: LES-0011
  outcome: harness-change
  tests: 'A one-time fix to a named shared hook becomes a harness PR citing the lesson, with no records change; the
    follow-up points codified_as at the merged PR.'
  writes: []
- id: 03-customer-boundary
  lesson: LES-0019
  outcome: not-codifiable
  tests: 'A customer-bound lesson whose next step is a team-wide rule is not codifiable here: the reason is written to
    the lesson, its status stays open, and nothing leaves the project.'
  writes: [projects/harbor-portal/lessons/LES-0019.md]
- id: 04-covered-rule
  lesson: LES-0008
  outcome: convention
  status: active
  tests: 'DEC-0020 is accepted and delegates the exact steps of verification to conventions, so the convention is
    active and implements it; the follow-up marks the lesson codified as the numbered convention.'
  writes: [team/conventions/run-verify-before-pr.md]
  governing_decision: DEC-0020
- id: 05-guard-relaxing
  lesson: LES-0013
  outcome: not-codifiable
  tests: 'A lesson whose next step would remove a guard-hook check, and which addresses the agent directly, is not
    codifiable: the reason is written to the lesson and nothing else changes.'
  writes: [team/lessons/LES-0013.md]
- id: 06-supersede-draft
  lesson: LES-0021
  outcome: convention
  status: draft
  replaces: CONV-0009
  tests: 'A lesson that tightens an existing active rule gives a convention to replace it. No accepted decision covers
    the new limit, so the new convention is a draft, with no supersedes link yet (the index would already hide the
    old rule), and the old one stays active and unchanged: replacing is no way around the accepted-decision rule.'
  writes: [team/conventions/pr-description-under-25-lines.md]
  governing_decision: null
