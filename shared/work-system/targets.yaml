# Which harnesses carry the shared work-system layer, and where each piece lands in them.
# scripts/sync_shared.py renders shared/work-system/ into these paths with each harness's profile and copies the
# result; `--check` (CI) fails on any difference or on a placeholder the profile does not fill, so the layer is edited
# once, here, and every harness pins the rendering of the same source.
#
# A shared file may hold `{{name}}` placeholders. Each harness's profile (profiles/<harness>.yaml, `params:`) fills
# them: who owns decisions, how a Decision is filed, which Atlassian site and space hold knowledge, the merge rule and
# the approval steps. Nothing person- or company-specific is written into a shared file itself.
#
# A work harness may also name an org overlay (`org: orgs/<org>`, a path from the repository root): the company's own
# flow skill (`org-process`) and its org.yaml (team-harness.org/v1: ticket types, gates, review request). Its params
# win over the profile's, it fills the generated {{org_*}} placeholders, and its skills are copied into the harness
# too, verbatim (orgs/README.md). It may override only `tracker` and the `kb_*` params. A company's private fork
# changes that one line to its own org. suite-default never takes one.
#
# `own_skills:` lists a harness's own skills, which sync_shared.py leaves alone. Any other directory under
# harnesses/<h>/skills/ that the layer or the org does not produce is deleted by sync_shared.py and fails --check.
#
# team-default is not listed: it is the pre-registered A/B example (flightdeck/decision.yaml), not the work system.
# Every directory under shared/work-system/skills/ ships to every harness below, except one that a harness names in
# its own `skills:` (that one goes to that harness only). A new shared skill therefore needs no edit here: add its
# directory with a SKILL.md whose `name:` is the directory's name, then run sync_shared.py, relock.py and
# render_envs.py. This list is the record of what ships today; a name in it must be a shared skill directory.
skills: [jira-ticket, decision-ticket, work-docs, work-start, github-pr, extract-records,
         knowledge-context, query-knowledge, whats-next, plan-to-tickets]   # every harness below
hook: hooks/guard_work_system.py          # -> native/claude-code/hooks/guard_work_system.py
hook_command: python3 "$HOME/.claude/hooks/guard_work_system.py"
# More hooks, each beside the one above; settings.json must register `command` on `event` (KAN-431).
session_hooks:
- file: hooks/knowledge_session_end.py
  event: SessionEnd
  command: python3 "$HOME/.claude/hooks/knowledge_session_end.py"
guide_fragment: guide/knowledge.md        # -> a marked block at the end of harnesses/<h>/CLAUDE.md
env_example: env.example                  # -> harnesses/<h>/.env.example: the session's environment names
harnesses:
  suite-default:
    profile: profiles/suite-default.yaml
  work-default:
    profile: profiles/work-default.yaml
    org: orgs/example-co                  # placeholder org: agents file no approval tickets until a company's replaces it
    skills: [release-approvals]           # in addition to the list above
    own_skills: [change-set]              # the harness's own, not rendered here
