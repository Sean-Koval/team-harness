# work-default: a company's services on the company's own Atlassian site.
# Fills the {{placeholders}} in shared/work-system/ for this harness (scripts/sync_shared.py).
#
# kb_site and kb_space are placeholders on purpose: this is a public example, and the company overlay replaces them
# with the real site and space before the harness is used. Until it does, the skills write no Confluence page. They
# are never defaulted to another site.
params:
  owner: "the ticket's owner"
  tracker: "the team's Jira project on the company's Atlassian site"
  kb_site: "COMPANY-SITE.atlassian.net"
  kb_space: "COMPANY-SPACE"
  kb_notes: "the team's engineering notes page"
  kb_research: "the team's research or design page"
  kb_decisions: "the team's decision records page"
  wall: >-
    Employer content (tickets, pages, code, logs, meeting transcripts, Symphony chat) stays on the company's systems
    and in tools the company approved on the work machine. Never write it to any other Atlassian site, to Notion, to a
    personal notes vault, or to any personal sync or backup, and never tag it for a personal system. If the knowledge-base site or
    space this harness names still reads COMPANY-SITE or COMPANY-SPACE, the company overlay was not applied: write no page, and say
    so in the PR.
  decision_filing: >-
    Create the question in the work ticket's project, under the same epic. If the project has a **Decision** work
    type, use it and fill its fields. If it does not, create a **Task** labelled `type:decision` and put each field
    below as a heading in its description:
  decision_labels: >-
    `exec:human`, the work ticket's `repo:` or component label, and `type:decision` when it is a Task; assign it to
    the ticket's owner (its assignee, otherwise its reporter)
  # The guard hook's MCP roles: which servers this harness binds as the tracker and the wiki (names from
  # harness.lock binding.mcp; a test holds them equal), and the ai-dlc server. JSON.
  mcp_bindings: '{"tracker": ["jira"], "wiki": ["jira"], "ai-dlc": ["ai-dlc"]}'
  merge_mode: "never"
  merge_rule: >-
    **Merging: never.** You never merge, approve a PR, enable auto-merge or dismiss a review at work. The approvers
    the company's org overlay declares approve (or merge) the PR from their gate tickets (`release-approvals`); hangar
    lands change sets only after each repository's own approvers approve. The hook refuses `gh pr merge`.
  scope_map: >-
    A customer engagement is `project` with `boundary: customer`, linked `belongs_to` its project, and its records
    never leave that project. The team's own tooling, process and services are `team`. A person's own notes are
    `personal`. The company overlay may list its projects here; until it does, keep the Source's own scope.
  approvals: >-
    Every PR goes through the company's review steps: use the `release-approvals` skill once the PR is open. It
    files one approval ticket per gate the company's org overlay declares (`org-process` describes the flow), adds
    each gate's line to the PR body, and drafts a review request that a person posts.
